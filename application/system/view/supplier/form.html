<form class="layui-form" action="{:url()}" method="post" id="editForm" lay-filter="editForm">
 
    <div class="layui-form-item">
		<label class="layui-form-label">供应商名称</label>
        <div class="layui-input-inline">
            <input type="text" class="layui-input field-supplier_name" name="supplier_name" lay-verify="required" autocomplete="off" placeholder="请输入供应商名称">
        </div>
		<label class="layui-form-label">供应商类型</label>
        <div class="layui-input-inline">
            <select name="supplier_type" lay-verify="" id="supplier_type">
                <option value="1" selected>生产商</option>
                <option value="2">代理商</option>
                <option value="3">经销商</option>
            </select>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">发票类型</label>
        <div class="layui-input-inline">
            <select name="invoice_type" lay-verify="">
                <option value="1" selected>普通发票</option>
                <option value="2">专用发票</option>
            </select>
        </div>
        <label class="layui-form-label">税率</label>
        <div class="layui-input-inline">
            <input type="text" class="layui-input field-tax_rate" name="tax_rate" lay-verify="" autocomplete="off" placeholder="请输入税率,百分比如13.00表示13%">
        </div>
    </div>
    <div class="layui-form-item">
		<label class="layui-form-label">付款类型</label>
        <div class="layui-input-inline">
            <select name="payment_type" lay-verify="">
                <option value="1" selected>预付款</option>
                <option value="2">月结</option>
            </select>
        </div>
		<label class="layui-form-label">供应商账号</label>
        <div class="layui-input-inline">
            <input type="text" class="layui-input field-bank_account" name="bank_account" lay-verify="" autocomplete="off" placeholder="请输入供应商账号">
        </div>
        <label class="layui-form-label">开户行</label>
        <div class="layui-input-inline">
            <input type="text" class="layui-input field-bank_name" name="bank_name" lay-verify="" autocomplete="off" placeholder="请输入开户行">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">开户支行</label>
        <div class="layui-input-inline">
            <input type="text" class="layui-input field-bank_branch" name="bank_branch" lay-verify="" autocomplete="off" placeholder="请输入开户支行">
        </div>
		<label class="layui-form-label">统一社会信用代码</label>
        <div class="layui-input-inline">
            <input type="text" class="layui-input field-credit_code" name="credit_code" lay-verify="" autocomplete="off" placeholder="请输入统一信用代码">
        </div>
        <label class="layui-form-label">地址</label>
        <div class="layui-input-inline">
            <input type="text" class="layui-input field-address" name="address" lay-verify="" autocomplete="off" placeholder="请输入地址">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">联系人</label>
        <div class="layui-input-inline">
            <input type="text" class="layui-input field-contact_person" name="contact_person" lay-verify="" autocomplete="off" placeholder="请输入联系人">
        </div>
        <label class="layui-form-label">联系电话</label>
        <div class="layui-input-inline">
            <input type="text" class="layui-input field-contact_phone" name="contact_phone" lay-verify="" autocomplete="off" placeholder="请输入联系电话">
        </div>
        <label class="layui-form-label">手机号</label>
        <div class="layui-input-inline">
            <input type="text" class="layui-input field-contact_mobile" name="contact_mobile" lay-verify="" autocomplete="off" placeholder="请输入手机号">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">微信号</label>
        <div class="layui-input-inline">
            <input type="text" class="layui-input field-wechat" name="wechat" lay-verify="" autocomplete="off" placeholder="请输入微信号">
        </div>
        <label class="layui-form-label">QQ</label>
        <div class="layui-input-inline">
            <input type="text" class="layui-input field-contact_qq" name="contact_qq" lay-verify="" autocomplete="off" placeholder="请输入QQ">
        </div>
        <label class="layui-form-label">邮箱</label>
        <div class="layui-input-inline">
            <input type="text" class="layui-input field-contact_email" name="contact_email" lay-verify="" autocomplete="off" placeholder="请输入邮箱">
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-input-block">
            {:token()}
            <input type="hidden" class="field-id" name="id">
        </div>
    </div>
    <div class="pop-bottom-bar">
        <button type="submit" class="layui-btn layui-btn-normal" lay-submit="" lay-filter="formSubmit" hisi-data="{pop: true, refresh: true}">提交保存</button>
        <a href="javascript:parent.layui.layer.closeAll();" class="layui-btn layui-btn-primary ml10">取消</a>
    </div>
    </form>
    {include file="block/layui" /}
    <script>
    var formData = {:json_encode($formData)};
    layui.use(['form', 'func','upload'], function() {
        var $ = layui.jquery, form = layui.form, upload = layui.upload;

        layui.func.assign(formData);

        form.val('editForm', {
            "supplier_type": formData.supplier_type,
            "invoice_type": formData.invoice_type,
            "payment_type": formData.payment_type,
        });
        // 必须重新渲染
        form.render('select');
    });
	function ShowLayerMessage(msgStr,msgIndex)
	{
		layui.use(['layer'], function(){
			var layer = layui.layer;
			layer.msg(msgStr, {icon: msgIndex});
		});
	}
    </script>
